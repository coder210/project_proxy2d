name: proxy2d code CI

# 代码 CI：不依赖商用资源（assets/ 被 .gitignore 忽略），可直接运行。
# 引擎位于 third_party/joy（submodule），本仓根 CMakeLists 会自动构建它。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (code only)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --target project_proxy2d --config Debug
