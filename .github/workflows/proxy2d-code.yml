name: proxy2d code CI

# 代码 CI：不依赖商用资源（assets/ 被 .gitignore 忽略），可直接运行。
# 引擎位于 third_party/joy（submodule），本仓根 CMakeLists 会自动构建它。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (code only)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # 引擎仓 joy 目前是私有：需要 SUBMODULE_TOKEN（对 joy 有 Contents:Read 的 PAT）。
          # 引擎公开后这行可保留，会自动回落到 github.token。
          token: ${{ secrets.SUBMODULE_TOKEN || github.token }}

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --target project_proxy2d --config Debug
