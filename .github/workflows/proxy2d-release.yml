name: proxy2d release

# 发布 CI：先拉取私有商用资源，再打包。
# 需要在仓库 Secrets 里配置 ASSETS_TOKEN（对私有资源仓有读权限的 PAT / deploy key）。
on:
  push:
    tags:
      - 'proxy2d-v*'
  workflow_dispatch:

jobs:
  package:
    name: Package project_proxy2d (with private assets)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fetch private assets
        shell: pwsh
        run: >
          ./scripts/fetch_assets.ps1
          -Repo "https://x-access-token:${{ secrets.ASSETS_TOKEN }}@github.com/coder210/project_proxy2d-assets.git"

      - name: Configure
        run: cmake -DBUILD_PROJECT_PROXY2D=ON -S . -B build

      - name: Build
        run: cmake --build build --target project_proxy2d --config Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: project_proxy2d-windows
          retention-days: 14
          path: build/Release/**
