name: Build project_proxy2d for Android

# 独立仓库：SDL 的 Android 工程位于 third_party/joy/SDL/android-project。
# 游戏根 CMakeLists 从 app/ 向上 5 层（app -> android-project -> SDL -> joy -> third_party -> 仓库根）。
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # 引擎仓 joy 目前是私有：需要 SUBMODULE_TOKEN（对 joy 有 Contents:Read 的 PAT）。
          # 引擎公开后这行可保留，会自动回落到 github.token。
          token: ${{ secrets.SUBMODULE_TOKEN || github.token }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Copy build.gradle to SDL project
        run: cp build.gradle third_party/joy/SDL/android-project/app/

      - name: Patch build.gradle for standalone layout
        run: |
          cd third_party/joy/SDL/android-project/app/

          # 游戏根 CMakeLists（5 层）
          sed -i 's#\.\./\.\./\.\./CMakeLists.txt#../../../../../CMakeLists.txt#' build.gradle

          grep -nE "path |arguments |abiFilters" build.gradle

      - name: Add copyIcons task to build.gradle
        run: |
          cd third_party/joy/SDL/android-project/app/
          cat >> build.gradle << 'EOF'

          task copyIcons {
              doLast {
                  def densities = ['hdpi', 'mdpi', 'xhdpi', 'xxhdpi', 'xxxhdpi']
                  def sourceFile = file('../../../../../assets/logo.png')
                  if (!sourceFile.exists()) {
                      throw new GradleException("assets/logo.png not found at ${sourceFile.absolutePath}")
                  }
                  densities.each { density ->
                      def targetDir = file("src/main/res/mipmap-${density}")
                      if (!targetDir.exists()) {
                          targetDir.mkdirs()
                      }
                      copy {
                          from sourceFile
                          into targetDir
                          rename '.*', 'ic_launcher.png'
                      }
                  }
              }
          }

          preBuild.dependsOn copyIcons

          if (project.hasProperty('appDisplayName')) {
              android.defaultConfig {
                  resValue "string", "app_name", project.appDisplayName
              }
          }

          android.applicationVariants.all { variant ->
              variant.outputs.all { output ->
                  def targetName = project.hasProperty('targetName') ? project.targetName : 'Game'
                  def buildType = variant.buildType.name
                  outputFileName = "${targetName}-${buildType}.apk"
              }
          }
          EOF

      - name: Inject android:roundIcon (MIUI/HyperOS 仅声明 android:icon 时会显示空白图标)
        run: |
          cd third_party/joy/SDL/android-project/app/src/main/
          if ! grep -q 'android:roundIcon' AndroidManifest.xml; then
            sed -i 's#android:icon="@mipmap/ic_launcher"#android:icon="@mipmap/ic_launcher"\n        android:roundIcon="@mipmap/ic_launcher"#' AndroidManifest.xml
          fi
          grep -n 'android:icon\|android:roundIcon' AndroidManifest.xml

      - name: Build APK
        run: |
          cd third_party/joy/SDL/android-project/
          chmod +x gradlew
          ./gradlew assembleDebug -PtargetName=project_proxy2d -PappDisplayName="Project Proxy 2D"

      # 启动闪退最常见原因是 APK 里缺 MonoVM 原生库或托管程序集。
      # 这里直接校验产物内容，避免"构建成功但装上就闪退"。
      - name: Verify APK contents
        run: |
          apk=third_party/joy/SDL/android-project/app/build/outputs/apk/debug/project_proxy2d-debug.apk
          echo "--- app/libs on disk ---"
          ls -la third_party/joy/SDL/android-project/app/libs/arm64-v8a/ || true
          echo "--- lib/ ---"
          unzip -Z1 "$apk" | grep -E '^lib/.*\.so$' || true
          echo "--- assets (top) ---"
          unzip -Z1 "$apk" | grep -E '^assets/(JoyGame\.dll|lib/Joy\.Bindings\.dll|lib/System\.Private\.CoreLib\.dll)$' || true
          for f in \
            lib/arm64-v8a/libmain.so \
            lib/arm64-v8a/libmonosgen-2.0.so \
            lib/arm64-v8a/libSystem.Native.so \
            assets/JoyGame.dll \
            assets/lib/Joy.Bindings.dll \
            assets/lib/System.Private.CoreLib.dll; do
            unzip -Z1 "$apk" | grep -qx "$f" \
              || { echo "::error::APK 缺少 $f（启动会直接闪退）"; exit 1; }
          done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: project_proxy2d-debug
          retention-days: 7
          path: third_party/joy/SDL/android-project/app/build/outputs/apk/debug/project_proxy2d-debug.apk
