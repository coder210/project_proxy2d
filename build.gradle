def buildAsLibrary = project.hasProperty('BUILD_AS_LIBRARY');
def buildAsApplication = !buildAsLibrary
if (buildAsApplication) {
    apply plugin: 'com.android.application'
}
else {
    apply plugin: 'com.android.library'
}

android {
    compileSdkVersion 34
    if (buildAsApplication) {
        namespace "org.libsdl.app"
    }
    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_APP_PLATFORM=android-16", "-DANDROID_STL=c++_static", "-DCMAKE_VERBOSE_MAKEFILE=ON", "-DMOBILE_ASSETS_DIR=${System.getProperty("user.dir")}/app/src/main/assets"
                // joy 的 Android MonoVM runtime pack 只暂存 arm64，构建其它 ABI 会
                // 把 arm64 的 libmonosgen 塞进 x86_64/armv7 目录，运行期 dlopen 失败闪退。
                abiFilters 'arm64-v8a'
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    applicationVariants.all { variant ->
        def cap = variant.name.capitalize()
        tasks["merge${cap}Assets"]
                .dependsOn("externalNativeBuild${cap}")
        // CMake 的 POST_BUILD 才把 libmonosgen-2.0.so / libSystem.*.so 写进
        // app/libs/<abi>；原生库合并必须排在 CMake 之后，否则这些 .so 不会进 APK，
        // 启动时 dlopen 失败 → 直接闪退。
        tasks.matching { it.name == "merge${cap}NativeLibs" }.configureEach {
            dependsOn "externalNativeBuild${cap}"
        }
    }
    if (!project.hasProperty('EXCLUDE_NATIVE_LIBS')) {
        sourceSets.main {
            jniLibs.srcDir 'libs'
        }
        externalNativeBuild {
            // ndkBuild {
            //     path 'jni/Android.mk'
            // }
            cmake {
                path "../../../CMakeLists.txt"
                version "3.22.1"
            }
        }

    }
    lintOptions {
        abortOnError false
    }

    if (buildAsLibrary) {
        libraryVariants.all { variant ->
            variant.outputs.each { output ->
                def outputFile = output.outputFile
                if (outputFile != null && outputFile.name.endsWith(".aar")) {
                    def fileName = "org.libsdl.app.aar";
                    output.outputFile = new File(outputFile.parent, fileName);
                }
            }
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}
